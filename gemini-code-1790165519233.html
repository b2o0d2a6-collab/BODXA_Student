<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لعبة الكينج الأولى</title>
    <style>
        body {
            background-color: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>
    <h1>مرحباً بك يا كينج في عالم البرمجة! 👑</h1>
    <p>عدد النقاط: <span id="score">0</span></p>
    <button onclick="addPoints()">اضغط لتزود نقاطك!</button>

    <script>
        let score = 0;
        function addPoints() {
            score += 10;
            document.getElementById('score').innerText = score;
        }
    </script>
</body>
</html>
